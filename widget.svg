<svg width="620" height="220" viewBox="0 0 620 220" fill="none" xmlns="http://w3.org">
  <defs>
    <!-- Эффект черно-белого фото с повышенным контрастом -->
    <filter id="grayscale-contrast">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0    0    0    1 0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.18" intercept="-0.1"/>
        <feFuncG type="linear" slope="1.18" intercept="-0.1"/>
        <feFuncB type="linear" slope="1.18" intercept="-0.1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        * { box-sizing: border-box; }
        .widget-container {
          width: 620px;
          height: 220px;
          margin: 0;
          padding: 18px;
          display: grid;
          grid-template-columns: 118px 1fr;
          gap: 16px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.18);
          background:
            radial-gradient(circle at 82% 18%, rgba(192, 23, 32, 0.22), transparent 190px),
            radial-gradient(circle at 18% 82%, rgba(159, 181, 199, 0.16), transparent 180px),
            repeating-linear-gradient(180deg, transparent 0 34px, rgba(0, 0, 0, 0.54) 35px 38px, transparent 39px 70px),
            linear-gradient(135deg, #191919, #050505);
          color: #f2f2f2;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          position: relative;
        }
        .widget-container::before {
          position: absolute;
          inset: 0;
          opacity: 0.26;
          background:
            linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
            linear-gradient(180deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
          background-size: 30px 30px;
          content: "";
          pointer-events: none;
        }
        .photo {
          position: relative;
          z-index: 1;
          height: 182px;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.2);
          background: #0b0b0b;
        }
        .photo img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: url(#grayscale-contrast);
        }
        .content {
          position: relative;
          z-index: 2;
          display: grid;
          align-content: start;
          gap: 6px;
        }
        .kicker, .meta, .tags {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
        .kicker { color: #c01720; }
        h1 {
          margin: 0;
          font-size: 34px;
          font-weight: 900;
          line-height: 0.95;
          letter-spacing: -0.02em;
          color: #ffffff;
        }
        p {
          max-width: 420px;
          margin: 2px 0 4px 0;
          color: #b7b7b7;
          font-size: 13.5px;
          line-height: 1.35;
        }
        .meta {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          color: #9fb5c7;
        }
        .tags {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 4px;
        }
        .tags span {
          padding: 3px 6px;
          border: 1px solid rgba(255, 255, 255, 0.16);
          background: rgba(255, 255, 255, 0.06);
          color: #d8d8d8;
        }
        .pulse {
          position: absolute;
          right: 16px;
          bottom: 8px;
          left: 152px;
          z-index: 1;
          height: 24px;
          opacity: 0.38;
          pointer-events: none;
          overflow: hidden;
        }
        .pulse svg {
          display: block;
          width: 200%;
          height: 100%;
        }
        /* Анимация бегущей линии пульса */
        .pulse-path {
          stroke-dasharray: 600;
          stroke-dashoffset: 600;
          animation: heartbeat 4s linear infinite;
        }
        @keyframes heartbeat {
          to {
            stroke-dashoffset: 0;
          }
        }
      </style>
      <div class="widget-container">
        <div class="photo">
          <img src="data:image/jpeg;base64," alt="Роман Тагиров" />
        </div>
        <div class="content">
          <div class="kicker">cxzcr / middle web developer</div>
          <h1>Роман Тагиров</h1>
          <p>Веб-системы, автоматизация, парсинг данных, коммерческие проекты и IT-стартап Vexor.</p>
          <div class="meta">
            <span>Production focus</span>
            <span>Commercial web</span>
            <span>Vexor</span>
          </div>
          <div class="tags">
            <span>Python</span>
            <span>Web</span>
            <span>Parsing</span>
            <span>Automation</span>
          </div>
        </div>
        <div class="pulse">
          <svg viewBox="0 0 380 42" preserveAspectRatio="none">
            <path class="pulse-path" d="M0 22 H62 L72 22 L78 8 L85 35 L94 22 H152 L164 22 L170 16 L177 27 L186 22 H246 L256 22 L264 4 L274 38 L286 22 H380" fill="none" stroke="#c01720" stroke-width="2" />
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>