<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#191919"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
    
    <radialGradient id="redGlow" cx="82%" cy="18%" r="50%">
      <stop offset="0%" style="stop-color:#c01720;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#c01720;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="blueGlow" cx="18%" cy="82%" r="50%">
      <stop offset="0%" style="stop-color:#9fb5c7;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#9fb5c7;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    
    <!-- Line pattern -->
    <pattern id="lines" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="34" fill="transparent"/>
      <rect y="35" width="70" height="3" fill="rgba(0,0,0,0.54)"/>
      <rect y="38" width="70" height="32" fill="transparent"/>
    </pattern>
    
    <!-- Pulse animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.38; }
        50% { opacity: 0.6; }
      }
      .pulse-path { animation: pulse 2s ease-in-out infinite; }
      @keyframes gradientShift {
        0% { opacity: 0.22; }
        100% { opacity: 0.28; }
      }
    </style>
  </defs>
  
  <!-- Border -->
  <rect x="0" y="0" width="620" height="220" rx="4" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  
  <!-- Background -->
  <rect x="0" y="0" width="620" height="220" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="620" height="220" fill="url(#redGlow)"/>
  <rect x="0" y="0" width="620" height="220" fill="url(#blueGlow)"/>
  <rect x="0" y="0" width="620" height="220" fill="url(#lines)"/>
  <rect x="0" y="0" width="620" height="220" fill="url(#grid)" opacity="0.26"/>
  
  <!-- Photo area -->
  <rect x="18" y="18" width="118" height="184" rx="2" fill="#0b0b0b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Profile image placeholder (replace with your actual image URL) -->
  <image x="18" y="18" width="118" height="184" preserveAspectRatio="xMidYMid slice" 
         href="https://raw.githubusercontent.com/roman-tagirov/roman-tagirov/main/profile.png" 
         clip-path="inset(0)">
    <!-- To use your real image, replace href with your image URL:
         href="https://raw.githubusercontent.com/roman-tagirov/roman-tagirov/main/profile.jpg"
    -->
  </image>
  
  <!-- Content area -->
  <g transform="translate(152, 22)">
    <!-- Kicker -->
    <text x="0" y="0" font-family="Finlandica, Segoe UI, sans-serif" font-size="12" font-weight="700" 
          letter-spacing="1" fill="#c01720" text-transform="uppercase">cxzcr / middle web developer</text>
    
    <!-- Name -->
    <text x="0" y="38" font-family="Montserrat, Finlandica, sans-serif" font-size="48" font-weight="900" 
          fill="#f2f2f2" letter-spacing="-0.5">Роман Тагиров</text>
    
    <!-- Description -->
    <text x="0" y="82" font-family="Finlandica, Segoe UI, sans-serif" font-size="15" fill="#b7b7b7" 
          font-weight="400">
      <tspan x="0" dy="0">Веб-системы, автоматизация, парсинг</tspan>
      <tspan x="0" dy="20">данных, коммерческие проекты и</tspan>
      <tspan x="0" dy="20">IT-стартап Vexor.</tspan>
    </text>
    
    <!-- Meta tags -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="85" height="20" rx="3" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="42" y="14" font-family="Finlandica, sans-serif" font-size="10" font-weight="700" 
            fill="#9fb5c7" text-anchor="middle" letter-spacing="0.8" text-transform="uppercase">Production focus</text>
      
      <rect x="91" y="0" width="85" height="20" rx="3" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="133" y="14" font-family="Finlandica, sans-serif" font-size="10" font-weight="700" 
            fill="#9fb5c7" text-anchor="middle" letter-spacing="0.8" text-transform="uppercase">Commercial web</text>
      
      <rect x="182" y="0" width="60" height="20" rx="3" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="212" y="14" font-family="Finlandica, sans-serif" font-size="10" font-weight="700" 
            fill="#9fb5c7" text-anchor="middle" letter-spacing="0.8" text-transform="uppercase">Vexor</text>
    </g>
    
    <!-- Skill tags -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="58" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="29" y="16" font-family="Finlandica, sans-serif" font-size="11" font-weight="700" 
            fill="#d8d8d8" text-anchor="middle" text-transform="uppercase">Python</text>
      
      <rect x="64" y="0" width="46" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="87" y="16" font-family="Finlandica, sans-serif" font-size="11" font-weight="700" 
            fill="#d8d8d8" text-anchor="middle" text-transform="uppercase">Web</text>
      
      <rect x="116" y="0" width="58" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="145" y="16" font-family="Finlandica, sans-serif" font-size="11" font-weight="700" 
            fill="#d8d8d8" text-anchor="middle" text-transform="uppercase">Parsing</text>
      
      <rect x="180" y="0" width="88" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <text x="224" y="16" font-family="Finlandica, sans-serif" font-size="11" font-weight="700" 
            fill="#d8d8d8" text-anchor="middle" text-transform="uppercase">Automation</text>
    </g>
  </g>
  
  <!-- Pulse line -->
  <g transform="translate(152, 196)" opacity="0.38">
    <path class="pulse-path"
          d="M0 0 H62 L72 0 L78 -14 L85 13 L94 0 H152 L164 0 L170 -6 L177 5 L186 0 H246 L256 0 L264 -18 L274 16 L286 0 H380"
          fill="none" stroke="#c01720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Invisible click area overlay (entire widget is clickable) -->
  <a href="https://cxzcr.ru" target="_blank">
    <rect x="0" y="0" width="620" height="220" fill="transparent"/>
  </a>
</svg>
